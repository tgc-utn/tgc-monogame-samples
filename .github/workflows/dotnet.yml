name: .NET

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
      continue-on-error: true # TODO: remove once StyleCop violations are cleaned up
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
