repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: check-xml
  - id: check-yaml
  - id: check-json
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: pretty-format-json
    args: [--autofix, --indent, '2', --no-sort-keys]
  - id: trailing-whitespace

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.0
  hooks:
  - id: markdownlint-fix

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']

- repo: https://github.com/semgrep/semgrep
  rev: v1.165.0
  hooks:
  - id: semgrep
    args: [--config, p/csharp, --error]

- repo: local
  hooks:
  - id: dotnet-format
    name: dotnet format
    language: system
    entry: dotnet format TGC.MonoGame.Samples.sln
    pass_filenames: false
    types_or: [c#]

  - id: dotnet-build
    name: dotnet build (analyzers)
    language: system
    # TODO: disabled until StyleCop violations are resolved. Steps to enable:
    #   1. Run: dotnet build TGC.MonoGame.Samples.sln -p:EnableMGCBItems=false
    #   2. Fix all reported violations (SA-prefixed warnings)
    #   3. Remove this comment block and the `stages` key below
    # stages: [manual]
    entry: dotnet build TGC.MonoGame.Samples.sln --no-restore -warnaserror -p:EnableMGCBItems=false
    pass_filenames: false
    types_or: [c#]

  - id: dotnet-vulnerable
    name: dotnet list vulnerable packages (fails if found — .NET 7+ exits 1)
    language: system
    entry: dotnet list package --vulnerable --include-transitive
    pass_filenames: false

  - id: lizard
    name: lizard complexity check
    language: python
    entry: lizard
    args: [--CCN, '23', --length, '215', -w, --languages, csharp]   # TODO: reduce CCN to 15, length to 100 once long methods are refactored
    types_or: [c#]
    additional_dependencies: [lizard]
